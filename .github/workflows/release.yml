name: Release build

# Manual artifact build; publishing a GitHub Release is a separate action.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powersync-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'jdkruzr/AragonitePowerSync' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'

      - name: Test and lint release variant
        run: ./gradlew --no-daemon --no-configuration-cache :client:testReleaseUnitTest :client:lintRelease

      - name: Restore release signing configuration
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: python
        run: |
          import base64, os, pathlib
          os.umask(0o077)
          names = ('RELEASE_KEYSTORE_BASE64', 'RELEASE_KEYSTORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Release signing secrets are incomplete.')
          keystore = pathlib.Path(os.environ['RUNNER_TEMP']) / 'powersync-release.jks'
          keystore.write_bytes(base64.b64decode(os.environ['RELEASE_KEYSTORE_BASE64'], validate=True))
          config = pathlib.Path.home() / '.local/share/aragonite-powersync/signing/client.properties'
          config.parent.mkdir(parents=True, exist_ok=True)
          # Java Properties.load(InputStream) expects Latin-1 with Unicode escapes.
          def escape(value):
              out = ''
              for char in value:
                  if char in '\\ =:#!': out += '\\' + char
                  elif char == '\n': out += '\\n'
                  elif char == '\r': out += '\\r'
                  elif char == '\t': out += '\\t'
                  elif not 32 <= ord(char) <= 126:
                      raw = char.encode('utf-16-be')
                      out += ''.join('\\u' + raw[i:i+2].hex() for i in range(0, len(raw), 2))
                  else: out += char
              return out
          values = {'storeFile': str(keystore), 'storePassword': os.environ['RELEASE_KEYSTORE_PASSWORD'],
                    'keyAlias': os.environ['RELEASE_KEY_ALIAS'], 'keyPassword': os.environ['RELEASE_KEY_PASSWORD']}
          config.write_text(''.join(key + '=' + escape(value) + '\n' for key, value in values.items()), encoding='ascii')

      - name: Build signed release APK
        run: ./gradlew --no-daemon --no-configuration-cache :client:assembleRelease

      - name: Verify signing identity and package artifact
        env:
          EXPECTED_CERT_SHA256: f61b114923bef983aa12e876ea12bbc52f017363ef7103a96c2f978dc19aeb35
        run: |
          set -euo pipefail
          apk=client/build/outputs/apk/release/client-release.apk
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/powersync-certificate.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/powersync-certificate.txt")
          test "$actual" = "$EXPECTED_CERT_SHA256"
          mkdir -p dist
          cp "$apk" dist/PowerSync-release.apk
          cp "$RUNNER_TEMP/powersync-certificate.txt" dist/signing-certificate.txt
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit.txt
          (cd dist && sha256sum PowerSync-release.apk > SHA256SUMS)

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/powersync-release.jks"
          rm -f "$HOME/.local/share/aragonite-powersync/signing/client.properties"

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: powersync-release-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: powersync-checks-${{ github.run_number }}
          path: |
            client/build/test-results/testReleaseUnitTest/TEST-*.xml
            client/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
